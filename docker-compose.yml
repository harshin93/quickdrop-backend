version: "3.9"

services:
  auth_postgres:
    image: postgres:15
    container_name: quickdrop-auth-postgres
    environment:
      POSTGRES_USER: quickdrop_auth_user
      POSTGRES_PASSWORD: quickdrop_auth_password
      POSTGRES_DB: quickdrop_auth
    ports:
      - "5433:5432"
    volumes:
      - auth_postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  upload_postgres:
    image: postgres:15
    container_name: quickdrop-upload-postgres
    environment:
      POSTGRES_USER: quickdrop_upload_user
      POSTGRES_PASSWORD: quickdrop_upload_password
      POSTGRES_DB: quickdrop_upload
    ports:
      - "5434:5432"
    volumes:
      - upload_postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: quickdrop-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: quickdrop_minio_user
      MINIO_ROOT_PASSWORD: quickdrop_minio_password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped

  minio_create_bucket:
    image: minio/mc:latest
    container_name: quickdrop-minio-create-bucket
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 quickdrop_minio_user quickdrop_minio_password;
      do
        echo 'Waiting for MinIO...';
        sleep 2;
      done;
      mc mb -p local/quickdrop-uploads;
      mc anonymous set none local/quickdrop-uploads;
      echo 'MinIO bucket quickdrop-uploads is ready.';
      exit 0;
      "

  auth_service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: quickdrop-auth-service
    command: uvicorn services.auth_service.app.main:app --host 0.0.0.0 --port 8000
    environment:
      AUTH_DATABASE_URL: postgresql+psycopg2://quickdrop_auth_user:quickdrop_auth_password@auth_postgres:5432/quickdrop_auth
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-secret-change-me}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
    depends_on:
      - auth_postgres
    ports:
      - "8000:8000"
    restart: unless-stopped

  upload_service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: quickdrop-upload-service
    command: uvicorn services.upload_service.app.main:app --host 0.0.0.0 --port 8001
    environment:
      UPLOAD_DATABASE_URL: postgresql+psycopg2://quickdrop_upload_user:quickdrop_upload_password@upload_postgres:5432/quickdrop_upload
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-secret-change-me}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: quickdrop_minio_user
      S3_SECRET_KEY: quickdrop_minio_password
      S3_BUCKET_NAME: quickdrop-uploads
      S3_REGION_NAME: us-east-1
    depends_on:
      - upload_postgres
      - minio
      - minio_create_bucket
    ports:
      - "8001:8001"
    restart: unless-stopped

  gateway_service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: quickdrop-gateway-service
    command: uvicorn services.gateway_service.app.main:app --host 0.0.0.0 --port 8002
    environment:
      AUTH_SERVICE_URL: http://auth_service:8000
      UPLOAD_SERVICE_URL: http://upload_service:8001
    depends_on:
      - auth_service
      - upload_service
    ports:
      - "8002:8002"
    restart: unless-stopped

volumes:
  auth_postgres_data:
  upload_postgres_data:
  minio_data: