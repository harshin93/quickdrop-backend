version: "3.9"

services:
  auth_postgres:
    image: postgres:15
    container_name: quickdrop-auth-postgres
    environment:
      POSTGRES_USER: quickdrop_auth_user
      POSTGRES_PASSWORD: quickdrop_auth_password
      POSTGRES_DB: quickdrop_auth
    ports:
      - "5433:5432"
    volumes:
      - auth_postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  upload_postgres:
    image: postgres:15
    container_name: quickdrop-upload-postgres
    environment:
      POSTGRES_USER: quickdrop_upload_user
      POSTGRES_PASSWORD: quickdrop_upload_password
      POSTGRES_DB: quickdrop_upload
    ports:
      - "5434:5432"
    volumes:
      - upload_postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  auth_service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: quickdrop-auth-service
    command: uvicorn services.auth_service.app.main:app --host 0.0.0.0 --port 8000
    environment:
      AUTH_DATABASE_URL: postgresql+psycopg2://quickdrop_auth_user:quickdrop_auth_password@auth_postgres:5432/quickdrop_auth
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-secret-change-me}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
    depends_on:
      - auth_postgres
    ports:
      - "8000:8000"
    restart: unless-stopped

  upload_service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: quickdrop-upload-service
    command: uvicorn services.upload_service.app.main:app --host 0.0.0.0 --port 8001
    environment:
      UPLOAD_DATABASE_URL: postgresql+psycopg2://quickdrop_upload_user:quickdrop_upload_password@upload_postgres:5432/quickdrop_upload
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-secret-change-me}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
    depends_on:
      - upload_postgres
    ports:
      - "8001:8001"
    volumes:
      - ./services/upload_service/uploads:/app/services/upload_service/uploads
    restart: unless-stopped

  gateway_service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: quickdrop-gateway-service
    command: uvicorn services.gateway_service.app.main:app --host 0.0.0.0 --port 8002
    environment:
      AUTH_SERVICE_URL: http://auth_service:8000
      UPLOAD_SERVICE_URL: http://upload_service:8001
    depends_on:
      - auth_service
      - upload_service
    ports:
      - "8002:8002"
    restart: unless-stopped

volumes:
  auth_postgres_data:
  upload_postgres_data:
